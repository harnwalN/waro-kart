<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peabody AGV Rally</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f14; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    outline: none;
  }
</style>
</head>
<body>
<canvas id="screen" width="320" height="180" tabindex="0"></canvas>
<script src="js/map.js"></script>
<script src="js/gfx.js"></script>
<script src="js/tex.js"></script>
<script src="js/view3d.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    var c = document.getElementById('screen');
    c.focus();
    AGV.game.boot(c);
  });
</script>
</body>
</html>
